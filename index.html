<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#00796B" />
    <meta
      name="description"
      content="ISBN から、登録した複数の図書館の蔵書と貸出状況を一度に確認できます。"
    />
    <!-- 検索エンジンに正規URLを明示する（#151）。 -->
    <link rel="canonical" href="https://libcheck.app/" />
    <!-- OGP / Twitter カード（SNS シェア時の表示。#116） -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LibCheck" />
    <meta property="og:title" content="LibCheck — 図書館の蔵書をかんたん検索" />
    <meta
      property="og:description"
      content="ISBN から、登録した複数の図書館の蔵書と貸出状況を一度に確認できます。"
    />
    <meta property="og:url" content="https://libcheck.app/" />
    <meta property="og:image" content="https://libcheck.app/og-image.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="500" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>LibCheck — 図書館の蔵書をかんたん検索</title>
    <!-- 構造化データ（#151）。リッチリザルト対応。 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "LibCheck",
        "description": "ISBN から、登録した複数の図書館の蔵書と貸出状況を一度に確認できます。",
        "url": "https://libcheck.app/",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Web, Android, iOS",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Cloudflare Web Analytics（#76。Cookie 不使用・個人を特定しない計測） -->
    <script
      type="module"
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "36dde0862ae84cf7957e9b97a3f0073f"}'
    ></script>
  </body>
</html>
